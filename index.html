            ISTJ: { name: "物流师", group: "Sentinels", groupName: "守护者", slogan: "“实际且注重事实的可靠之人，其严谨性与责任感不容置疑。”", traits: ["严谨负责", "踏实稳重", "遵守纪律", "略显固执"], careers: ["注册会计师", "审计师", "行政总监", "高级法官"], love: "用实际行动代替甜言蜜语，极其忠诚稳定，是长久过日子的不二人选。", match: "ESFP, ESTP" },
            ISFJ: { name: "守卫者", group: "Sentinels", groupName: "守护者", slogan: "“非常专心致志且温暖的守护者，时刻准备着保护他们爱的人。”", traits: ["细心体贴", "无私奉献", "记忆力强", "不懂拒绝"], careers: ["医护人员", "幼儿教师", "社会工作者", "行政专员"], love: "温柔体贴，默默付出，把家庭和伴侣的幸福放在绝对的第一位。", match: "ESTP, ESFP" },
            ESTJ: { name: "总经理", group: "Sentinels", groupName: "守护者", slogan: "“出色的管理者，在管理事情或组织团队方面无出其右。”", traits: ["组织力强", "直言不讳", "责任心重", "控制欲强"], careers: ["高级运营总监", "银行行长", "政府官员", "项目经理"], love: "稳定可靠，有强烈的家庭责任感，喜欢生活井井有条、目标明确。", match: "ISFP, ISTP" },
            ESFJ: { name: "执政官", group: "Sentinels", groupName: "守护者", slogan: "“极有同情心、爱交际且受欢迎的人，总是热心提供帮助。”", traits: ["热情友好", "善于照顾人", "重视传统", "在意评价"], careers: ["活动策划人", "公关经理", "客服主管", "人力资源"], love: "浪漫、重视节日与纪念日，极度需要伴侣的情感肯定、赞美与陪伴。", match: "ISTP, ISFP" },
            ISTP: { name: "鉴赏家", group: "Explorers", groupName: "探险家", slogan: "“大胆而实际的实验家，擅长使用各种形式的工具与技术。”", traits: ["动手能力强", "冷静应变", "崇尚自由", "难以预测"], careers: ["机械工程师", "飞行员", "特技演员", "硬件极客"], love: "相处轻松不粘人，用实际行动解决问题，崇尚给彼此足够的个人自由度。", match: "ESTJ, ESFJ" },
            ISFP: { name: "探险家", group: "Explorers", groupName: "探险家", slogan: "“灵活而迷人的艺术家，时刻准备着探索和体验新鲜事物。”", traits: ["审美极佳", "温柔随和", "热爱自由", "回避冲突"], careers: ["室内设计师", "时装设计师", "摄影师", "音乐家"], love: "极具浪漫情调与艺术气息，用细腻的行动和礼物表达浓浓爱意。", match: "ENFJ, ESFJ" },
            ESTP: { name: "企业家", group: "Explorers", groupName: "探险家", slogan: "“聪明、精力充沛且非常善于感知的人，享受生活在边缘。”", traits: ["机智果断", "行动力强", "极具魅力", "缺乏长性"], careers: ["企业创始人", "销售总监", "运动员", "战地记者"], love: "恋爱轰轰烈烈，追求刺激与新鲜感，幽默风趣且极具人格吸引力。", match: "ISFJ, ISTJ" },
            ESFP: { name: "表演者", group: "Explorers", groupName: "探险家", slogan: "“充满活力与热情的人，生活在他们周围永远不会感到无聊。”", traits: ["天生乐观", "极具感染力", "热爱狂欢", "逃避沉重"], careers: ["演员/艺人", "时尚买手", "活动主持人", "导游"], love: "把恋爱变成一场盛大的派对，给伴侣带来无尽的快乐与浪漫惊喜。", match: "ISTJ, ISFJ" }
        };

        // 高级 3D 几何低多边形卡通头像 SVG 组件
        function LowPolyAvatar({ type }) {
            const colors = {
                Analysts: ["#c084fc", "#7e22ce", "#a855f7"],
                Diplomats: ["#34d399", "#047857", "#10b981"],
                Sentinels: ["#60a5fa", "#1d4ed8", "#3b82f6"],
                Explorers: ["#fbbf24", "#b45309", "#f59e0b"]
            };
            const group = mbtiData[type]?.group || "Analysts";
            const [c1, c2, c3] = colors[group];

            return (
                <svg viewBox="0 0 200 200" className="w-full h-full drop-shadow-xl transform hover:scale-105 transition duration-300">
                    <defs>
                        <linearGradient id={`grad-${type}`} x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor={c1} />
                            <stop offset="50%" stopColor={c2} />
                            <stop offset="100%" stopColor={c3} />
                        </linearGradient>
                    </defs>
                    <rect width="200" height="200" rx="45" fill={`url(#grad-${type})`} opacity="0.18" />
                    <polygon points="100,20 145,50 160,105 100,140 40,105 55,50" fill={`url(#grad-${type})`} opacity="0.85" />
                    <polygon points="100,140 160,105 180,165 100,190 20,165 40,105" fill={c2} opacity="0.7" />
                    <polygon points="70,70 100,45 130,70 100,105" fill="#ffffff" opacity="0.35" />
                    <polygon points="85,85 100,72 115,85 100,100" fill="#ffffff" opacity="0.55" />
                    <circle cx="80" cy="85" r="9" fill="#1e293b" />
                    <circle cx="120" cy="85" r="9" fill="#1e293b" />
                    <polygon points="100,100 92,122 108,122" fill="#1e293b" opacity="0.9" />
                    <path d="M 84 142 Q 100 158 116 142" stroke="#1e293b" strokeWidth="5" fill="none" strokeLinecap="round" />
                    <text x="100" y="38" textAnchor="middle" fill="#ffffff" fontSize="17" fontWeight="900" letterSpacing="3">{type}</text>
                </svg>
            );
        }

        function App() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const isAdmin = urlParams.get('admin') === 'true';

            const [logs, setLogs] = React.useState(() => {
                const saved = localStorage.getItem('mbti_usage_logs');
                return saved ? JSON.parse(saved) : [];
            });

            const tokenUsedKey = `mbti_used_${token}`;
            const isTokenAlreadyUsed = token && localStorage.getItem(tokenUsedKey) === 'true';

            const [view, setView] = React.useState(() => {
                if (isAdmin) return 'home';
                if (isTokenAlreadyUsed) return 'expired';
                if (!token) return 'unauthorized';
                return 'home';
            });

            const [questions, setQuestions] = React.useState([]);
            const [currentIndex, setCurrentIndex] = React.useState(0);
            const [answers, setAnswers] = React.useState({});
            const [resultType, setResultType] = React.useState(null);
            const [scores, setScores] = React.useState(null);
            const [selectedModalType, setSelectedModalType] = React.useState(null);

            const radarChartRef = React.useRef(null);
            const chartInstance = React.useRef(null);

            if (!isAdmin && !token) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="clay-card max-w-md w-full p-8 text-center">
                            <div className="w-16 h-16 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">🔒</div>
                            <h2 className="text-2xl font-bold text-slate-800 mb-2">需要访问授权</h2>
                            <p className="text-slate-600 text-sm mb-6">当前页面需要通过管理员分发的专属测试链接才能进入。管理员可直接在网址后加上 <code className="bg-slate-100 px-1.5 py-0.5 rounded text-purple-600">?admin=true</code>。</p>
                        </div>
                    </div>
                );
            }

            if (!isAdmin && isTokenAlreadyUsed && view !== 'result' && view !== 'expired') {
                setView('expired');
            }

            const startQuiz = () => {
                if (!isAdmin && localStorage.getItem(tokenUsedKey) === 'true') {
                    setView('expired');
                    return;
                }
                const generated = getRandomTestQuestions();
                setQuestions(generated);
                setCurrentIndex(0);
                setAnswers({});
                setView('quiz');
            };

            // 每做完一道题，点击选项后 0.2 秒自动跳转下一题
            const handleSelectOption = (questionId, type, score) => {
                const newAnswers = { ...answers, [questionId]: { type, score } };
                setAnswers(newAnswers);

                setTimeout(() => {
                    if (currentIndex < questions.length - 1) {
                        setCurrentIndex(currentIndex + 1);
                    } else {
                        calculateResult(newAnswers);
                    }
                }, 200);
            };

            const calculateResult = (finalAnswers) => {
                let counts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
                Object.values(finalAnswers).forEach(ans => {
                    if (counts[ans.type] !== undefined) counts[ans.type] += ans.score;
                });

                const finalType = (counts.E >= counts.I ? 'E' : 'I') +
                                  (counts.S >= counts.N ? 'S' : 'N') +
                                  (counts.T >= counts.F ? 'T' : 'F') +
                                  (counts.J >= counts.P ? 'J' : 'P');

                setResultType(finalType);
                setScores(counts);

                if (!isAdmin && token) {
                    localStorage.setItem(tokenUsedKey, 'true');
                    const newLog = { token: token, result: finalType, time: new Date().toLocaleString() };
                    const updatedLogs = [newLog, ...logs];
                    setLogs(updatedLogs);
                    localStorage.setItem('mbti_usage_logs', JSON.stringify(updatedLogs));
                }

                setView('result');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            React.useEffect(() => {
                if (view === 'result' && scores && radarChartRef.current) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }

                    const ctx = radarChartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'radar',
                        data: {
                            labels: ['外向 (E)', '直觉 (N)', '情感 (F)', '知觉 (P)', '内向 (I)', '感觉 (S)', '思考 (T)', '判断 (J)'],
                            datasets: [{
                                label: '八维偏好得分分布',
                                data: [
                                    scores.E || 2, scores.N || 2, scores.F || 2, scores.P || 2,
                                    scores.I || 2, scores.S || 2, scores.T || 2, scores.J || 2
                                ],
                                backgroundColor: 'rgba(168, 85, 247, 0.2)',
                                borderColor: '#9333ea',
                                pointBackgroundColor: '#7e22ce',
                                pointBorderColor: '#fff',
                                pointRadius: 4,
                                borderWidth: 2.5
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                r: {
                                    angleLines: { color: 'rgba(203, 213, 225, 0.5)' },
                                    grid: { color: 'rgba(203, 213, 225, 0.5)' },
                                    pointLabels: {
                                        font: { size: 12, weight: 'bold', family: 'Quicksand' },
                                        color: '#475569'
                                    },
                                    ticks: { display: false, max: 16 }
                                }
                            },
                            plugins: { legend: { display: false } }
                        }
                    });
                }
            }, [view, scores]);

            if (view === 'expired') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="clay-card max-w-md w-full p-8 text-center">
                            <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">🔒</div>
                            <h2 className="text-2xl font-bold text-slate-800 mb-2">该测试链接已失效</h2>
                            <p className="text-slate-600 text-sm mb-6">此专属测试链接已经成功使用并生成过一次报告。每个链接仅限完整使用 1 次。</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col justify-between p-4 sm:p-6 lg:p-8">
                    {/* 顶部导航 */}
                    <header className="max-w-6xl mx-auto w-full flex justify-between items-center py-4 mb-6">
                        <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setView('home')}>
                            <div className="w-11 h-11 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-lg">M</div>
                            <span className="text-xl sm:text-2xl font-extrabold tracking-wider bg-gradient-to-r from-purple-700 to-indigo-600 bg-clip-text text-transparent">MBTI PERSONALITIES</span>
                        </div>
                        <div className="flex space-x-2 sm:space-x-3 items-center">
                            <button onClick={() => setView('home')} className={`px-4 py-2 rounded-xl text-sm font-semibold transition ${view === 'home' ? 'bg-purple-600 text-white shadow-md' : 'bg-white/80 hover:bg-white text-slate-600'}`}>首页</button>
                            <button onClick={() => setView('encyclopedia')} className={`px-4 py-2 rounded-xl text-sm font-semibold transition ${view === 'encyclopedia' ? 'bg-purple-600 text-white shadow-md' : 'bg-white/80 hover:bg-white text-slate-600'}`}>16人格图鉴</button>
                            {isAdmin && (
                                <button onClick={() => setView('admin')} className={`px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center space-x-1 ${view === 'admin' ? 'bg-amber-600 text-white shadow-md' : 'bg-amber-100 hover:bg-amber-200 text-amber-800'}`}>
                                    <span>👑 后台</span>
                                    <span className="ml-1 px-1.5 py-0.5 bg-white/80 text-amber-900 rounded-full text-xs">{logs.length}</span>
                                </button>
                            )}
                        </div>
                    </header>

                    {/* 主体内容区 */}
                    <main className="max-w-6xl mx-auto w-full flex-grow">
                        {/* 1. 精美主页：四大阵营 + 嵌入所有 16 种卡通形象 */}
                        {view === 'home' && (
                            <div className="space-y-12 animate-fade-in pb-12">
                                <div className="clay-card p-8 sm:p-14 text-center relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-80 h-80 bg-purple-200/50 rounded-full blur-3xl -z-10"></div>
                                    <div className="absolute bottom-0 left-0 w-80 h-80 bg-blue-200/50 rounded-full blur-3xl -z-10"></div>
                                    
                                    {isAdmin && (
                                        <div className="mb-6 inline-block bg-amber-50 border border-amber-200 text-amber-800 text-xs px-4 py-2 rounded-xl font-bold shadow-sm">
                                            👑 管理员已登录（可无限次测试，点击右上角【后台】可查看使用数据统计）
                                        </div>
                                    )}

                                    <h1 className="text-3xl sm:text-5xl font-black text-slate-800 mb-4 tracking-tight">探索真实的自己，发现你的灵魂密码</h1>
                                    <p className="text-slate-600 max-w-2xl mx-auto mb-10 text-base sm:text-lg font-medium leading-relaxed">
                                        解锁立体 3D 几何低多边形卡通角色，获得多维雷达图可视化分析、职业适配走向与情感沟通黄金建议。
                                    </p>

                                    <div className="flex flex-col sm:flex-row justify-center items-center gap-4 mb-16">
                                        <button onClick={startQuiz} className="clay-btn bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold px-10 py-4 rounded-2xl text-lg shadow-xl hover:opacity-95 flex items-center space-x-2">
                                            <span>随机抽取 30 题开始测试 ✨</span>
                                        </button>
                                        <button onClick={() => setView('encyclopedia')} className="px-8 py-4 rounded-2xl text-base font-bold bg-white text-slate-700 hover:bg-slate-50 border border-slate-200 shadow-sm transition">
                                            浏览 16 人格全景图鉴
                                        </button>
                                    </div>

                                    {/* 四大性格阵营分组（内含 16 个人格头像预览，严格对齐参考图 2） */}
                                    <div className="text-left mb-8">
                                        <h2 className="text-2xl font-black text-slate-800 text-center mb-2">四大性格阵营分组</h2>
                                        <p className="text-slate-500 text-sm text-center mb-8">16 种人格类型归属于四大核心阵营，点击任意头像即可快速预览</p>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                        {[
                                            { key: "Analysts", name: "分析家 (Analysts)", badgeColor: "bg-purple-100 text-purple-700", border: "border-purple-200", types: ["INTJ", "INTP", "ENTJ", "ENTP"], desc: "理性、逻辑与战略见长，追求知识与卓越。" },
                                            { key: "Diplomats", name: "外交家 (Diplomats)", badgeColor: "bg-emerald-100 text-emerald-700", border: "border-emerald-200", types: ["INFJ", "INFP", "ENFJ", "ENFP"], desc: "注重情感共情、同理心与理想主义。" },
                                            { key: "Sentinels", name: "守护者 (Sentinels)", badgeColor: "bg-blue-100 text-blue-700", border: "border-blue-200", types: ["ISTJ", "ISFJ", "ESTJ", "ESFJ"], desc: "脚踏实地、讲求秩序与责任感。" },
                                            { key: "Explorers", name: "探险家 (Explorers)", badgeColor: "bg-amber-100 text-amber-700", border: "border-amber-200", types: ["ISTP", "ISFP", "ESTP", "ESFP"], desc: "自发灵活、活在当下、充满行动力。" }
                                        ].map(group => (
                                            <div key={group.key} className="clay-card p-6 text-left flex flex-col justify-between bg-white/90">
                                                <div>
                                                    <div className="mb-3">
                                                        <span className={`text-xs font-bold px-3 py-1 rounded-full ${group.badgeColor}`}>{group.key}</span>
                                                    </div>
                                                    <h3 className="text-lg font-bold text-slate-800 mb-1">{group.name}</h3>
                                                    <p className="text-xs text-slate-500 mb-4 leading-relaxed">{group.desc}</p>
                                                </div>

                                                {/* 嵌入该阵营的 4 个低多边形卡通头像卡片 */}
                                                <div className="grid grid-cols-4 gap-2 pt-3 border-t border-slate-100">
                                                    {group.types.map(type => (
                                                        <div key={type} onClick={() => setSelectedModalType(type)} className="cursor-pointer group text-center">
                                                            <div className="w-12 h-12 mx-auto rounded-xl p-1 bg-slate-50 group-hover:scale-110 transition">
                                                                <LowPolyAvatar type={type} />
                                                            </div>
                                                            <span className="text-[10px] font-bold text-slate-600 mt-1 block">{type}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 2. 管理员数据统计后台 */}
                        {view === 'admin' && isAdmin && (
                            <div className="space-y-6 animate-fade-in pb-12">
                                <div className="clay-card p-6 sm:p-8 bg-gradient-to-r from-slate-900 to-purple-950 text-white">
                                    <h2 className="text-2xl font-black mb-2">👑 管理员专属控制台</h2>
                                    <p className="text-purple-200 text-sm">记录了所有外发链接的使用情况与测试结果统计。</p>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div className="clay-card p-6 bg-white">
                                        <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">网站总使用次数 (成功出结果)</div>
                                        <div className="text-4xl font-black text-purple-600">{logs.length} <span className="text-sm font-normal text-slate-500">次</span></div>
                                    </div>
                                    <div className="clay-card p-6 bg-white">
                                        <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">管理员权限状态</div>
                                        <div className="text-xl font-bold text-emerald-600 flex items-center mt-2">
                                            <span className="w-3 h-3 rounded-full bg-emerald-500 inline-block mr-2 animate-pulse"></span>
                                            无限畅玩中 (?admin=true)
                                        </div>
                                    </div>
                                </div>
                                <div className="clay-card p-6 sm:p-8">
                                    <h3 className="text-lg font-bold text-slate-800 mb-4">详细使用记录清单</h3>
                                    {logs.length === 0 ? (
                                        <div className="text-center py-12 text-slate-400 text-sm">暂无其他人使用记录。</div>
                                    ) : (
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse">
                                                <thead>
                                                    <tr className="border-b border-slate-100 text-xs text-slate-400 uppercase">
                                                        <th className="py-3 px-4">序号</th>
                                                        <th className="py-3 px-4">访客 Token</th>
                                                        <th className="py-3 px-4">测试结果</th>
                                                        <th className="py-3 px-4">完成时间</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="text-sm divide-y divide-slate-100">
                                                    {logs.map((log, index) => (
                                                        <tr key={index} className="hover:bg-slate-50">
                                                            <td className="py-3 px-4 text-slate-400 font-mono">#{logs.length - index}</td>
                                                            <td className="py-3 px-4 font-bold text-slate-700">{log.token}</td>
                                                            <td className="py-3 px-4"><span className="px-2.5 py-1 rounded-lg bg-purple-100 text-purple-700 font-bold text-xs">{log.result}</span></td>
                                                            <td className="py-3 px-4 text-slate-500 text-xs">{log.time}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* 3. 答题交互页 (每题点选后自动无缝跳转) */}
                        {view === 'quiz' && questions.length > 0 && (
                            <div className="clay-card p-6 sm:p-10 animate-fade-in max-w-2xl mx-auto">
                                <div className="flex justify-between items-center mb-6">
                                    <span className="text-xs font-bold text-purple-600 uppercase tracking-wider">题目 {currentIndex + 1} / {questions.length}</span>
                                    <span className="text-xs font-medium text-slate-400">{Math.round(((currentIndex + 1) / questions.length) * 100)}% 完成</span>
                                </div>
                                <div className="w-full bg-slate-100 h-2.5 rounded-full mb-8 overflow-hidden">
                                    <div className="bg-gradient-to-r from-purple-500 to-indigo-500 h-2.5 rounded-full transition-all duration-300" style={{ width: `${((currentIndex + 1) / questions.length) * 100}%` }}></div>
                                </div>

                                <h2 className="text-xl sm:text-2xl font-bold text-slate-800 mb-8 leading-snug">{questions[currentIndex].text}</h2>

                                <div className="space-y-4 mb-4">
                                    {questions[currentIndex].options.map((opt, idx) => {
                                        const isSelected = answers[questions[currentIndex].id]?.type === opt.type && answers[questions[currentIndex].id]?.score === opt.score;
                                        return (
                                            <div 
                                                key={idx} 
                                                onClick={() => handleSelectOption(questions[currentIndex].id, opt.type, opt.score)}
                                                className={`p-4 sm:p-5 rounded-2xl border-2 cursor-pointer transition-all flex items-center justify-between ${isSelected ? 'border-purple-600 bg-purple-50/80 shadow-md scale-101' : 'border-slate-100 bg-white hover:border-purple-200 hover:bg-slate-50'}`}
                                            >
                                                <div className="flex items-center space-x-3">
                                                    <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center text-xs font-bold ${isSelected ? 'border-purple-600 bg-purple-600 text-white' : 'border-slate-300 text-transparent'}`}>✓</div>
                                                    <span className="text-sm sm:text-base font-medium text-slate-700">{opt.text}</span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="text-center text-xs text-purple-600 font-semibold mt-4">⚡ 极速模式：点击任意选项后将自动跳转下一题</div>
                            </div>
                        )}

                        {/* 4. 结果报告页 (完美对齐参考图 1 样式与雷达图、四维比例条) */}
                        {view === 'result' && resultType && scores && (
                            <div className="space-y-6 animate-fade-in pb-12">
                                <div className="clay-card p-8 sm:p-10 relative overflow-hidden flex flex-col sm:flex-row items-center justify-between">
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-purple-100/60 rounded-full blur-3xl -z-10"></div>
                                    <div className="text-left mb-6 sm:mb-0">
                                        <div className="flex items-center space-x-2 mb-2">
                                            <span className="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold">{mbtiData[resultType].groupName} ({mbtiData[resultType].group})</span>
                                            <span className="text-xs font-semibold text-slate-400">性格类型代号: {resultType}</span>
                                        </div>
                                        <h1 className="text-4xl sm:text-5xl font-black text-slate-800 mb-2">{resultType} - {mbtiData[resultType].name}</h1>
                                        <p className="text-purple-700 text-base sm:text-lg font-bold mb-3">{mbtiData[resultType].slogan}</p>
                                        <p className="text-slate-600 text-sm max-w-xl leading-relaxed">内代理想主义与坚定的内心价值观，拥有出色的共情能力与无限创意潜能，保持自信与独特光芒！</p>
                                    </div>
                                    <div className="w-36 h-36 flex-shrink-0">
                                        <LowPolyAvatar type={resultType} />
                                    </div>
                                </div>

                                {/* 左右双栏：左雷达图，右四维比例条（对齐参考图 1） */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="clay-card p-6 sm:p-8 flex flex-col justify-between">
                                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center">
                                            <span className="w-3 h-3 rounded-full bg-purple-600 mr-2"></span>
                                            八维偏好雷达图分析
                                        </h3>
                                        <div className="relative w-full h-72 flex items-center justify-center">
                                            <canvas ref={radarChartRef}></canvas>
                                        </div>
                                    </div>

                                    <div className="clay-card p-6 sm:p-8 flex flex-col justify-between">
                                        <h3 className="text-lg font-bold text-slate-800 mb-6 flex items-center">
                                            <span className="w-3 h-3 rounded-full bg-amber-500 mr-2"></span>
                                            四维偏好分值比例
                                        </h3>
                                        <div className="space-y-6">
                                            <div>
                                                <div className="flex justify-between text-xs font-bold text-slate-700 mb-1.5">
                                                    <span>外向 E ({Math.round(((scores.E || 2)/((scores.E||2)+(scores.I||2)))*100)}%)</span>
                                                    <span>内向 I ({Math.round(((scores.I || 2)/((scores.E||2)+(scores.I||2)))*100)}%)</span>
                                                </div>
                                                <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden flex">
                                                    <div className="bg-purple-500 h-full transition-all duration-500" style={{ width: `${((scores.E || 2)/((scores.E||2)+(scores.I||2)))*100}%` }}></div>
                                                    <div className="bg-purple-200 h-full transition-all duration-500" style={{ width: `${((scores.I || 2)/((scores.E||2)+(scores.I||2)))*100}%` }}></div>
                                                </div>
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-xs font-bold text-slate-700 mb-1.5">
                                                    <span>感觉 S ({Math.round(((scores.S || 2)/((scores.S||2)+(scores.N||2)))*100)}%)</span>
                                                    <span>直觉 N ({Math.round(((scores.N || 2)/((scores.S||2)+(scores.N||2)))*100)}%)</span>
                                                </div>
                                                <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden flex">
                                                    <div className="bg-emerald-500 h-full transition-all duration-500" style={{ width: `${((scores.S || 2)/((scores.S||2)+(scores.N||2)))*100}%` }}></div>
                                                    <div className="bg-emerald-200 h-full transition-all duration-500" style={{ width: `${((scores.N || 2)/((scores.S||2)+(scores.N||2)))*100}%` }}></div>
                                                </div>
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-xs font-bold text-slate-700 mb-1.5">
                                                    <span>思考 T ({Math.round(((scores.T || 2)/((scores.T||2)+(scores.F||2)))*100)}%)</span>
                                                    <span>情感 F ({Math.round(((scores.F || 2)/((scores.T||2)+(scores.F||2)))*100)}%)</span>
                                                </div>
                                                <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden flex">
                                                    <div className="bg-blue-500 h-full transition-all duration-500" style={{ width: `${((scores.T || 2)/((scores.T||2)+(scores.F||2)))*100}%` }}></div>
                                                    <div className="bg-blue-200 h-full transition-all duration-500" style={{ width: `${((scores.F || 2)/((scores.T||2)+(scores.F||2)))*100}%` }}></div>
                                                </div>
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-xs font-bold text-slate-700 mb-1.5">
                                                    <span>判断 J ({Math.round(((scores.J || 2)/((scores.J||2)+(scores.P||2)))*100)}%)</span>
                                                    <span>知觉 P ({Math.round(((scores.P || 2)/((scores.J||2)+(scores.P||2)))*100)}%)</span>
                                                </div>
                                                <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden flex">
                                                    <div className="bg-amber-500 h-full transition-all duration-500" style={{ width: `${((scores.J || 2)/((scores.J||2)+(scores.P||2)))*100}%` }}></div>
                                                    <div className="bg-amber-200 h-full transition-all duration-500" style={{ width: `${((scores.P || 2)/((scores.J||2)+(scores.P||2)))*100}%` }}></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="clay-card p-6">
                                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-purple-600 mr-2"></span>核心特质与优势</h3>
                                        <div className="flex flex-wrap gap-2 mb-4">
                                            {mbtiData[resultType].traits.map((t, idx) => (
                                                <span key={idx} className="px-3 py-1.5 rounded-xl bg-purple-50 text-purple-700 text-xs font-semibold">{t}</span>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="clay-card p-6">
                                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-emerald-600 mr-2"></span>适配职业方向</h3>
                                        <div className="flex flex-wrap gap-2 mb-4">
                                            {mbtiData[resultType].careers.map((c, idx) => (
                                                <span key={idx} className="px-3 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 text-xs font-semibold">{c}</span>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="clay-card p-6 sm:p-8">
                                    <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-blue-600 mr-2"></span>情感相处指南与灵魂默契搭档</h3>
                                    <p className="text-slate-600 text-sm mb-4 leading-relaxed">{mbtiData[resultType].love}</p>
                                    <div className="p-4 rounded-2xl bg-blue-50 border border-blue-100 flex items-center justify-between">
                                        <span className="text-xs font-bold text-blue-900">契合度极佳的搭档参考：</span>
                                        <span className="text-sm font-black text-blue-600">{mbtiData[resultType].match}</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 5. 16人格全景图鉴页 */}
                        {view === 'encyclopedia' && (
                            <div className="space-y-8 animate-fade-in pb-12">
                                <div className="text-center">
                                    <h1 className="text-3xl font-extrabold text-slate-800 mb-2">16 型人格全景图鉴</h1>
                                    <p className="text-slate-500 text-sm">点击任意低多边形卡通卡片查看详细深度解析</p>
                                </div>

                                {['Analysts', 'Diplomats', 'Sentinels', 'Explorers'].map(groupKey => {
                                    const groupItems = Object.keys(mbtiData).filter(k => mbtiData[k].group === groupKey);
                                    const groupTitle = groupItems.length > 0 ? mbtiData[groupItems[0]].groupName : '';
                                    return (
                                        <div key={groupKey} className="space-y-4">
                                            <h3 className="text-xl font-bold text-slate-800 border-l-4 border-purple-600 pl-3">{groupTitle} ({groupKey})</h3>
                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                                {groupItems.map(type => (
                                                    <div key={type} onClick={() => setSelectedModalType(type)} className="clay-card p-5 text-center cursor-pointer hover:scale-105 transition bg-white">
                                                        <div className="w-24 h-24 mx-auto mb-3"><LowPolyAvatar type={type} /></div>
                                                        <h4 className="font-bold text-slate-800 text-lg">{type}</h4>
                                                        <p className="text-xs text-purple-600 font-semibold mt-0.5">{mbtiData[type].name}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </main>

                    {/* 人格详情弹窗 */}
                    {selectedModalType && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div className="clay-card max-w-lg w-full p-6 sm:p-8 relative bg-white">
                                <button onClick={() => setSelectedModalType(null)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 font-bold">✕</button>
                                <div className="flex items-center space-x-4 mb-4">
                                    <div className="w-20 h-20"><LowPolyAvatar type={selectedModalType} /></div>
                                    <div>
                                        <h3 className="text-2xl font-bold text-slate-800">{selectedModalType} - {mbtiData[selectedModalType].name}</h3>
                                        <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-purple-100 text-purple-700">{mbtiData[selectedModalType].groupName}</span>
                                    </div>
                                </div>
                                <p className="text-purple-700 text-sm font-bold mb-3 italic">{mbtiData[selectedModalType].slogan}</p>
                                <div className="mb-4">
                                    <div className="text-xs font-bold text-slate-700 mb-2">核心特质：</div>
                                    <div className="flex flex-wrap gap-1.5">
                                        {mbtiData[selectedModalType].traits.map((t, i) => (
                                            <span key={i} className="px-2.5 py-1 bg-purple-50 text-purple-700 rounded-lg text-xs font-semibold">{t}</span>
                                        ))}
                                    </div>
                                </div>
                                <div className="text-xs text-slate-500 bg-slate-50 p-3 rounded-xl">灵魂默契搭档：{mbtiData[selectedModalType].match}</div>
                            </div>
                        </div>
                    )}

                    <footer className="max-w-6xl mx-auto w-full text-center py-6 text-xs text-slate-400 border-t border-slate-200/60 mt-8">
                        免责声明：本测评仅为趣味娱乐测试，不具备专业心理诊断效力。 | 管理员模式已就绪。
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
